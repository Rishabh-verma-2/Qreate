# Render Blueprint — New → Blueprint → pick this repo.
services:
  - type: web
    name: qreate-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free            # upgrade to starter+ for faster renders (free = 0.1 CPU)
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY          # private random value, generated by Render
        generateValue: true
      - key: ALLOW_LOCALHOST_CORS    # only the deployed frontend may call the API
        value: "false"
      - key: CORS_ORIGIN_REGEX       # set to e.g. ^https://qreate.*\.vercel\.app$ to allow previews
        value: ""
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: qreate
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      - key: RATE_LIMIT_VIDEOS_PER_HOUR
        value: "10"
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: AGNES_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: SCENE_RENDER_PARALLELISM
        value: "1"
      - key: VISUAL_RERANK        # free plan has 512 MB RAM — CLIP needs ~1 GB
        value: "false"
